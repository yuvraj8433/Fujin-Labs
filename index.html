<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Join Fujin Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <!-- Page 1 of 2: the sign-up form, built in the admin page. Anyone arriving from an invite link (?ref=CODE) lands here first. -->
  <div class="card top">
    <div class="brand"><i></i>Fujin Labs</div>
    <a class="btn" href="refer.html">Refer &amp; Earn</a>
  </div>

  <header class="card hero">
    <h1 id="formTitle">Join Fujin Labs</h1>
    <p class="lede" id="lede">Loading the form...</p>
  </header>

  <section class="card" id="formCard" hidden aria-labelledby="formTitle">
    <form class="stack" id="joinForm" novalidate style="margin-top:0">
      <div class="two">
        <label for="name">Full name<input id="name" autocomplete="name" maxlength="120"></label>
        <label for="email">Email<input id="email" type="email" inputmode="email" autocomplete="email" maxlength="200"></label>
      </div>
      <p class="hint bad" id="err_name" role="alert"></p>
      <div id="questions" style="display:flex;flex-direction:column;gap:18px"></div>
      <label for="ref" id="refBox"><span>Referral code <small id="refOpt">(if someone invited you)</small></span>
        <input id="ref" placeholder="FUJIN-XXXX" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <span class="lockrow" id="lockRow" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span id="lockMsg">Locked from your invite link</span>
        </span>
        <p class="hint" id="refHint"></p>
      </label>
      <p class="hint bad" id="formErr" role="alert"></p>
      <button class="big" id="submitBtn" type="submit">Submit and continue</button>
    </form>
  </section>

  <section class="card" id="doneCard" hidden aria-live="polite">
    <div class="success">
      <span class="ico" data-icon="check"></span>
      <div><h2>Thank you!</h2><p class="sub" id="doneMsg" style="margin:2px 0 0">Your response was recorded.</p></div>
    </div>
    <div class="row" style="margin-top:18px"><a class="btn primary" href="refer.html">See my Refer &amp; Earn rewards</a></div>
  </section>

  <section class="card" id="errCard" hidden>
    <h2>This form is not available</h2>
    <p class="sub" id="errMsg">It may be closed or the link may be wrong.</p>
  </section>

  <details class="card" id="lookup">
    <summary>Already joined? Open my Refer &amp; Earn page</summary>
    <form class="stack" id="lookupForm" novalidate>
      <label for="lookupEmail">Email you signed up with<input id="lookupEmail" type="email" inputmode="email" autocomplete="email"></label>
      <p class="hint" id="lookupErr"></p>
      <button type="submit" class="soft">Continue</button>
    </form>
  </details>

  <footer>Fujin Labs</footer>
</main>

<script src="config.js"></script>
<script src="formkit.js"></script>
<script src="app.js"></script>
<script>
const NEXT_PAGE = "refer.html";
const formId = "default";   /* one form for everyone; edit it in the admin page */
let FORM = null, refLocked = false;

/* ---- Load the form from the Sheet ---- */
(async function loadForm(){
  try{
    const out = await api.form(formId);
    FORM = out.form;
    document.title = FORM.title;
    $("formTitle").textContent = FORM.title;
    $("lede").textContent = FORM.description || "";
    $("lede").hidden = !FORM.description;
    FormKit.render($("questions"), FORM.fields);
    $("submitBtn").textContent = FORM.settings.submitLabel || "Submit";
    $("refBox").hidden = FORM.settings.referral === false;
    $("formCard").hidden = false;
    if(FORM.settings.referral !== false) initRef();
  }catch(e){
    $("lede").hidden = true;
    $("errMsg").textContent = e.message;
    $("errCard").hidden = false;
  }
})();

/* ---- Referral lock: a code that comes from an invite link cannot be edited or removed ---- */
function storedRef(){ try{ return localStorage.getItem("fujin_ref") || ""; }catch(e){ return ""; } }
function storeRef(v){ try{ localStorage.setItem("fujin_ref", v); }catch(e){} }
function clearRef(){ try{ localStorage.removeItem("fujin_ref"); }catch(e){} }

function lockRef(code){
  refLocked = true;
  const el = $("ref"); el.value = code; el.readOnly = true; el.classList.add("locked"); el.setAttribute("aria-readonly","true");
  el.tabIndex = -1; $("lockRow").hidden = false; $("refOpt").textContent = "(from your invite)";
}
function unlockRef(){
  refLocked = false;
  const el = $("ref"); el.readOnly = false; el.classList.remove("locked"); el.removeAttribute("aria-readonly");
  el.tabIndex = 0; $("lockRow").hidden = true; $("refOpt").textContent = "(if someone invited you)";
}
/* Block every way of editing a locked field. */
["keydown","beforeinput","paste","cut","drop"].forEach(ev => $("ref").addEventListener(ev, e => { if(refLocked) e.preventDefault(); }));

async function checkRef(){
  const code = $("ref").value.trim().toUpperCase(), h = $("refHint");
  h.className = "hint"; h.textContent = "";
  if(!code) return;
  try{
    const who = await api.check(code);
    if(who){
      h.className = "hint ok"; h.textContent = "Invited by " + who; $("lockMsg").textContent = "Locked. Invited by " + who + ".";
      return true;
    }
    h.className = "hint bad"; h.textContent = "We could not find that code.";
    if(refLocked){ clearRef(); unlockRef(); $("ref").value = ""; h.textContent = "That invite code is not valid, so the field is open. You can still join."; }
    return false;
  }catch(e){ return null; }
}
$("ref").addEventListener("blur", () => { if(!refLocked) checkRef(); });

async function initRef(){
  const fromLink = (new URLSearchParams(location.search).get("ref") || "").trim().toUpperCase();
  const code = /^FUJIN-[A-Z0-9]{4}$/.test(fromLink) ? fromLink : storedRef();
  if(code){ storeRef(code); lockRef(code); await checkRef(); }
}

/* ---- Submit: save the visitor on this device, then go to the next step ---- */
$("joinForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!FORM) return;
  const err = $("formErr"); err.textContent = ""; $("err_name").textContent = "";
  const name = $("name").value.trim(), email = $("email").value.trim().toLowerCase();
  if(!name || !EMAIL_RE.test(email)){
    $("err_name").textContent = !name ? "Enter your name." : "Enter a valid email address.";
    (!name ? $("name") : $("email")).focus(); return;
  }
  const got = FormKit.collect(FORM.fields, $("questions"));
  if(got.error) return;
  $("submitBtn").disabled = true;
  try{
    const res = await api.join({formId:FORM.id, name, email, ref:FORM.settings.referral === false ? null : ($("ref").value.trim().toUpperCase() || null), answers:got.answers});
    setUser({email, code:res.code});
    clearRef();
    if(res.after === "message"){
      $("doneMsg").textContent = res.message || "Your response was recorded.";
      $("formCard").hidden = true; $("doneCard").hidden = false; $("doneCard").scrollIntoView({behavior:"smooth"});
    } else location.href = NEXT_PAGE;
  }catch(ex){ err.textContent = ex.message || "Something went wrong. Please try again in a moment."; $("submitBtn").disabled = false; }
});

$("lookupForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("lookupErr"), email = $("lookupEmail").value.trim().toLowerCase();
  err.className = "hint"; err.textContent = "";
  if(!EMAIL_RE.test(email)) return err.textContent = "Enter the email you signed up with.";
  try{
    const res = await api.stats(email);
    if(!res){ err.className = "hint bad"; err.textContent = "No signup found for that email."; return; }
    setUser({email, code:res.code});
    location.href = NEXT_PAGE;
  }catch(ex){ err.className = "hint bad"; err.textContent = "Could not check right now. Try again shortly."; }
});
</script>
</body>
</html>
